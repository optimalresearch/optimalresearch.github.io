[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lmenv"
version = "0.1.0"
description = "Harness for the small-model language modelling task (loop-lm-pretrain)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch==2.7.1",
  "transformers==4.53.1",
  "tokenizers==0.21.4",
  "safetensors==0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["lmenv"]
